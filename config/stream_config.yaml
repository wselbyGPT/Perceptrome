ncbi:
  email: "you@example.com"   # put your real email if you want to be nice to NCBI
  api_key: null
  max_retries: 3
  backoff_seconds: 2.0

uniprot:
  base_url: "https://rest.uniprot.org"
  default_query: "reviewed:true AND fragment:false"
  include_isoforms: false
  request_timeout: 60
  retries: 3
  backoff_seconds: 2.0
  records_per_shard: 50000
  gzip_output: false

training:
  # small, just to smoke-test
  steps_per_plasmid: 25
  batch_size: 32

  # genome windowing (base/codon modes)
  window_size: 512
  stride: 256

  max_stream_epochs: 10
  shuffle_catalog: true
  hidden_dim: 512
  model_type: mlp   # mlp | transformer | ssm
  learning_rate: 1.0e-3
  beta_kl: 1.0e-3
  kl_warmup_steps: 5000
  max_grad_norm: 5.0

  # TensorBoard logging
  tensorboard_log_every: 10
  tensorboard_run_id: null

  # tokenizer (base|codon|aa)
  tokenizer: base
  frame_offset: 0

  # proteome (aa mode) windowing
  protein_window_aa: 256
  protein_stride_aa: 128
  min_orf_aa: 90

  # IMPORTANT: must be an int (not null) or cli.py may try int(None)
  max_protein_aa: 5000

  # biologically grounded GenBank/CDS options (aa + source=genbank)
  # These are "compatibility" keys some code versions expect.
  protein_strict_cds_only: false
  protein_require_translation: false
  protein_reject_partial: true
  protein_require_start_m: true
  protein_x_free: true
  protein_min_aa: 90
  protein_max_aa: 5000

io:
  cache_fasta_dir: "cache/fasta"
  cache_genbank_dir: "cache/genbank"
  cache_encoded_dir: "cache/encoded"
  model_dir: "model"
  checkpoints_dir: "model/checkpoints"
  logs_dir: "logs"
  state_file: "state/progress.json"

pretrain:
  # tensorized pretraining dataset archive (.npz)
  dataset_path: ""
  vocab_size: 32
  batch_size: 16
  epochs: 1
  hidden_size: 256
  learning_rate: 1.0e-4
  output_dir: "model/pretrain"
  enable_mlm: true
  enable_sme: true
  enable_contrastive: true
