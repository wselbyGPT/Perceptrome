worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstream: FastAPI backend (serves both API and built SPA)
    upstream api {
        server api:8000;
    }

    # ── HTTP server (redirect to HTTPS in production) ────────────────────
    server {
        listen 80;
        server_name _;

        # Health check endpoint (for ALB)
        location /api/health {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # Uncomment the next two lines and comment out the rest to force HTTPS:
        # return 301 https://$host$request_uri;

        # ── API routes ───────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ── WebSocket ────────────────────────────────────────────────────
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Static SPA (served by FastAPI's StaticFiles or directly) ─────
        # In the Docker image the built client is baked into the API container.
        # Nginx proxies everything to the API which mounts the SPA at /.
        # For higher performance, copy dist/ into nginx and serve directly:
        #
        # location / {
        #     root /usr/share/nginx/html;
        #     try_files $uri $uri/ /index.html;
        # }

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS server (uncomment when you have certs) ─────────────────────
    # For AWS ALB termination you do NOT need this block -- ALB handles TLS
    # and forwards plaintext to port 80 above. Use this only for direct
    # EC2/Docker deployment with your own certificates.
    #
    # server {
    #     listen 443 ssl;
    #     server_name app.perceptrome.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # Same location blocks as the HTTP server above:
    #     location /api/health { ... }
    #     location /api/       { ... }
    #     location /ws         { ... }
    #     location /           { ... }
    # }
}
