<!-- client/change_password.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perceptrome — Change Password</title>
  </head>
  <body class="auth-page">
    <div class="panel auth-card">
      <h1 id="page-title">Update Your Password</h1>
      <p class="auth-sub" id="page-subtitle">Choose a new password to keep your account secure.</p>
      <div id="whoami" class="who"></div>

      <form id="change-password-form" novalidate>
        <label for="current-password">Current Password</label>
        <input id="current-password" class="input" type="password" autocomplete="current-password" aria-describedby="current-password-error" required />
        <div id="current-password-error" class="field-error" role="alert"></div>

        <label for="new-password">New Password</label>
        <input id="new-password" class="input" type="password" autocomplete="new-password" minlength="12" aria-describedby="new-password-error" required />
        <div id="new-password-error" class="field-error" role="alert"></div>

        <div class="strength" aria-live="polite">
          <progress id="password-strength" max="5" value="0"></progress>
          <div id="password-strength-label" class="muted">Strength: Too weak</div>
        </div>

        <label for="confirm-password">Confirm New Password</label>
        <div class="password-row">
          <input id="confirm-password" class="input" type="password" autocomplete="new-password" minlength="12" aria-describedby="confirm-password-error" required />
          <button id="toggle-btn" class="btn btn-secondary" type="button">Show</button>
        </div>
        <div id="confirm-password-error" class="field-error" role="alert"></div>

        <div class="toolbar mt-12">
          <button id="submit-btn" class="btn" type="submit">Update Password</button>
          <button id="logout-btn" class="btn btn-secondary" type="button">Logout</button>
        </div>

        <div id="msg" class="msg" role="status" aria-live="polite"></div>
      </form>
    </div>

    <script type="module" src="/src/change_password.ts"></script>
  </body>
</html>
