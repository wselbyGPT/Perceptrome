<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perceptrome Login</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121922;
        --border: #273445;
        --text: #e6edf3;
        --muted: #9fb0c3;
        --accent: #2563eb;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #111826 0%, #0b0f14 45%, #070a0e 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .card {
        width: min(430px, 92vw);
        background: rgba(18, 25, 34, 0.95);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .sub {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      label {
        display: block;
        margin: 10px 0 6px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f141a;
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: #4f8cff;
        box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.15);
      }

      button {
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 11px 12px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .msg {
        margin-top: 10px;
        min-height: 1.2rem;
        font-size: 0.9rem;
        color: var(--danger);
      }

      .hint {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Perceptrome Login</h1>
      <p class="sub">Sign in to access runs, logs, and WebSocket controls.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button id="submit-btn" type="submit">Sign in</button>
        <div id="msg" class="msg"></div>
      </form>

      <div class="hint">Local dev uses the Vite proxy, so cookies work on the same origin.</div>
    </div>

    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
