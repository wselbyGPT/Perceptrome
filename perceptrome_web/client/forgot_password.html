<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
  </head>
  <body class="auth-page">
    <div class="panel auth-card">
      <h1>Forgot password</h1>
      <p class="auth-sub">Enter your email and we will send a password reset link if the account exists.</p>

      <form id="forgot-password-form">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="you@example.com" required />
        <button id="submit-btn" class="btn" type="submit">Send reset email</button>
        <div id="msg" class="msg"></div>
      </form>

      <p class="auth-hint"><a href="/login.html">Back to login</a></p>
    </div>

    <script type="module" src="/src/forgot_password.ts"></script>
  </body>
</html>
