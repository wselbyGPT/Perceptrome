<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <script type="module" crossorigin src="/assets/reset_password-utV01UGH.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth_api-ClpJ3xBc.js">
    <link rel="stylesheet" crossorigin href="/assets/auth_api-B123tcEF.css">
  </head>
  <body class="auth-page">
    <div class="panel auth-card">
      <h1>Reset password</h1>
      <p class="auth-sub">Paste your reset token or open this page directly from your reset email link.</p>

      <form id="reset-password-form">
        <label for="token">Reset token</label>
        <input id="token" class="input" type="text" placeholder="Paste token" required />

        <label for="new-password">New password</label>
        <input id="new-password" class="input" type="password" minlength="8" required />

        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" class="input" type="password" minlength="8" required />

        <button id="submit-btn" class="btn" type="submit">Reset password</button>
        <div id="msg" class="msg"></div>
      </form>

      <p class="auth-hint"><a href="/login.html">Back to login</a></p>
    </div>

  </body>
</html>
