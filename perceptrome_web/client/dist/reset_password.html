<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; margin: 0; background: #0b0f14; color: #e6edf3; }
      .wrap { max-width: 560px; margin: 3rem auto; padding: 1.5rem; background: #121922; border: 1px solid #273445; border-radius: 12px; }
      h1 { margin-top: 0; }
      label { display: block; margin: 0.8rem 0 0.3rem; color: #9fb0c3; }
      input { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: #0f141a; color: #e6edf3; }
      button { margin-top: 0.8rem; padding: 0.6rem 0.9rem; background: #2563eb; border: 0; border-radius: 8px; color: white; font-weight: 700; }
      .msg { min-height: 1.2rem; margin-top: 0.6rem; color: #fbbf24; }
      a { color: #93c5fd; }
    </style>
    <script type="module" crossorigin src="/assets/reset_password-CQROxFkB.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth_api-BSFIGZ1Z.js">
  </head>
  <body>
    <div class="wrap">
      <h1>Reset password</h1>
      <p>Paste your reset token or open this page directly from your reset email link.</p>

      <form id="reset-password-form">
        <label for="token">Reset token</label>
        <input id="token" type="text" placeholder="Paste token" required />

        <label for="new-password">New password</label>
        <input id="new-password" type="password" minlength="8" required />

        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" minlength="8" required />

        <button id="submit-btn" type="submit">Reset password</button>
        <div id="msg" class="msg"></div>
      </form>

      <p><a href="/login.html">Back to login</a></p>
    </div>

  </body>
</html>
