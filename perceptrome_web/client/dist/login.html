<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perceptrome Login</title>
    <script type="module" crossorigin src="/assets/login-D7vJM_UT.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth_api-C3j5QkHe.js">
    <link rel="stylesheet" crossorigin href="/assets/auth_api-BqHYb5Pl.css">
  </head>
  <body class="auth-page">
    <div class="panel auth-card auth-card--narrow">
      <h1>Perceptrome Login</h1>
      <p class="auth-sub">Sign in to access runs, logs, and WebSocket controls.</p>

      <form id="login-form" class="stack">
        <div class="input-group">
          <label class="label" for="email">Email</label>
        <input id="email" class="input" type="email" autocomplete="username" required />
        </div>

        <div class="input-group">
          <label class="label" for="password">Password</label>
        <input id="password" class="input" type="password" autocomplete="current-password" required />
        </div>

        <button id="submit-btn" class="btn btn--primary" type="submit">Sign in</button>
        <div id="msg" class="msg error"></div>
        <div id="verify-help" class="auth-hint"></div>
        <div class="auth-hint"><a href="/forgot_password.html">Forgot your password?</a></div>
      </form>

      <div class="auth-hint">Local dev uses the Vite proxy, so cookies work on the same origin.</div>
    </div>

  </body>
</html>
