<!-- client/change_password.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perceptrome — Change Password</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121922;
        --border: #273445;
        --text: #e6edf3;
        --muted: #9fb0c3;
        --accent: #2563eb;
        --accent2: #1d4ed8;
        --danger: #ef4444;
        --ok: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #111826 0%, #0b0f14 45%, #070a0e 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        padding: 16px;
      }
      .card {
        width: min(520px, 95vw);
        background: rgba(18, 25, 34, 0.96);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.35);
      }
      h1 { margin: 0 0 6px; font-size: 1.2rem; }
      .sub { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; }
      label { display: block; margin: 10px 0 6px; color: var(--muted); font-size: .9rem; }
      input {
        width: 100%;
        background: #0f141a;
        color: var(--text);
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: white;
      }
      button:hover { background: var(--accent2); }
      button.secondary {
        background: #1b2430;
        color: var(--text);
        border: 1px solid #334155;
      }
      .msg { margin-top: 10px; min-height: 1.2rem; font-size: 0.9rem; }
      .msg.error { color: var(--danger); }
      .msg.ok { color: var(--ok); }
      .muted { color: var(--muted); }
      .who { margin-bottom: 8px; color: var(--muted); font-size: 0.85rem; }
      .actions { margin-top: 12px; display:flex; gap:8px; flex-wrap:wrap; }
    </style>
    <script type="module" crossorigin src="/assets/change_password-C-sgN3mv.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth_api-DhigGiIq.js">
  </head>
  <body>
    <div class="card">
      <h1>Change Your Password</h1>
      <p class="sub">You must change your temporary password before continuing.</p>
      <div id="whoami" class="who"></div>

      <form id="change-password-form">
        <label for="current-password">Current Password</label>
        <input id="current-password" type="password" autocomplete="current-password" required />

        <label for="new-password">New Password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" required />

        <label for="confirm-password">Confirm New Password</label>
        <div class="row">
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
          <button id="toggle-btn" type="button" class="secondary">Show</button>
        </div>

        <div class="actions">
          <button id="submit-btn" type="submit">Update Password</button>
          <button id="logout-btn" type="button" class="secondary">Logout</button>
        </div>

        <div id="msg" class="msg"></div>
      </form>
    </div>

  </body>
</html>
