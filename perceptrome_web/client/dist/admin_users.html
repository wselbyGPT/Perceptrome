<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perceptrome — Admin Users</title>
    <script type="module" crossorigin src="/assets/admin_users-BAjbvBT4.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth_api-C3j5QkHe.js">
    <link rel="stylesheet" crossorigin href="/assets/auth_api-BqHYb5Pl.css">
  </head>
  <body class="page-admin">
    <div class="admin-wrap">
      <div class="panel admin-top">
        <div>
          <h1>Admin — Users</h1>
          <div class="muted">Create and manage Perceptrome users (MVP)</div>
        </div>
        <div class="toolbar">
          <span id="whoami" class="muted"></span>
          <a href="/" class="btn btn--secondary">Back to App</a>
          <button id="logout-btn" class="btn btn--secondary" type="button">Logout</button>
        </div>
      </div>

      <div class="panel">
        <h2>Create User</h2>

        <form id="create-user-form" class="stack">
          <div class="row">
            <div class="input-group">
              <label class="label" for="email">Email</label>
              <input id="email" class="input" type="email" required />
            </div>
            <div class="input-group">
              <label class="label" for="username">Username (optional)</label>
              <input id="username" class="input" type="text" minlength="3" />
            </div>
          </div>

          <div class="row3">
            <div class="input-group">
              <label class="label" for="password">Temporary Password</label>
              <input id="password" class="input" type="text" minlength="8" required />
            </div>
            <div class="input-group">
              <label class="label" for="role">Role</label>
              <select id="role" class="input">
                <option value="user" selected>user</option>
                <option value="admin">admin</option>
              </select>
            </div>
            <div class="cluster">
              <button id="gen-pass-btn" class="btn btn--secondary" type="button">Generate Password</button>
            </div>
          </div>

          <div class="cluster">
            <label class="checkbox-label">
              <input id="is-active" class="input" type="checkbox" checked />
              <span>Active</span>
            </label>
            <label class="checkbox-label">
              <input id="must-change-password" class="input" type="checkbox" checked />
              <span>Force password change on first login</span>
            </label>
          </div>

          <div class="cluster mt-2">
            <button id="create-btn" class="btn btn--primary" type="submit">Create User</button>
            <button id="refresh-btn" class="btn btn--secondary" type="button">Refresh List</button>
          </div>

          <div id="form-msg" class="msg"></div>
        </form>
      </div>

      <div class="panel">
        <h2>Users</h2>
        <div class="muted">Admin-only user list from <span class="mono">GET /api/admin/users</span></div>

        <div id="table-msg" class="msg"></div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Username</th>
                <th>Role</th>
                <th>Status</th>
                <th>Password Policy</th>
                <th>User ID</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="6" class="muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </body>
</html>
