<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perceptrome — Datasets</title>
    <script type="module" crossorigin src="/assets/datasets-B9FPlSyo.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth_api-C3j5QkHe.js">
    <link rel="stylesheet" crossorigin href="/assets/auth_api-BqHYb5Pl.css">
  </head>
  <body class="page-admin">
    <div class="admin-wrap">
      <div class="panel admin-top">
        <div>
          <h1>Dataset Catalog</h1>
          <div class="muted">Search and filter datasets from config manifests.</div>
        </div>
        <div class="toolbar">
          <span id="whoami" class="muted"></span>
          <a href="/" class="btn btn--secondary">Back to App</a>
          <button id="logout-btn" class="btn btn--secondary" type="button">Logout</button>
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <div class="input-group">
            <label class="label" for="search">Search</label>
            <input id="search" class="input" type="text" placeholder="dataset id, source, tag" />
          </div>
          <div class="input-group">
            <label class="label" for="source">Source</label>
            <select id="source" class="input">
              <option value="">All sources</option>
            </select>
          </div>
        </div>
        <div id="msg" class="msg"></div>
      </div>

      <div class="panel">
        <h2>Datasets</h2>
        <div id="cards" class="stack"></div>
      </div>

      <div class="panel">
        <h2>Preview</h2>
        <pre id="preview" class="results-wrap">Select a dataset to view preview rows.</pre>
      </div>
    </div>

  </body>
</html>
