<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <style>
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; margin: 0; background: #0b0f14; color: #e6edf3; }
      .wrap { max-width: 560px; margin: 3rem auto; padding: 1.5rem; background: #121922; border: 1px solid #273445; border-radius: 12px; }
      h1 { margin-top: 0; }
      label { display: block; margin: 0.8rem 0 0.3rem; color: #9fb0c3; }
      input { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: #0f141a; color: #e6edf3; }
      button { margin-top: 0.8rem; padding: 0.6rem 0.9rem; background: #2563eb; border: 0; border-radius: 8px; color: white; font-weight: 700; }
      .msg { min-height: 1.2rem; margin-top: 0.6rem; color: #fbbf24; }
      a { color: #93c5fd; }
    </style>
    <script type="module" crossorigin src="/assets/forgot_password-BmKb9tXl.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth_api-BSFIGZ1Z.js">
  </head>
  <body>
    <div class="wrap">
      <h1>Forgot password</h1>
      <p>Enter your email and we will send a password reset link if the account exists.</p>

      <form id="forgot-password-form">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />
        <button id="submit-btn" type="submit">Send reset email</button>
        <div id="msg" class="msg"></div>
      </form>

      <p><a href="/login.html">Back to login</a></p>
    </div>

  </body>
</html>
